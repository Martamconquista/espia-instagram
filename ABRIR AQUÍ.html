<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espía Instagram</title><meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="https://martamconquista.github.io/espia-instagram/recursos/icono-180.png?v=2">
<link rel="icon" href="recursos/icono-favicon.png"><meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Espía IG">
<style>
:root{--bg:#fff;--ink:#0A0A0A;--ink2:#525252;--line:#E8E8E8;--acc:#753E3B}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--ink:#F5F5F5;--ink2:#A3A3A3;--line:#262626;--acc:#B8706C}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.logo{width:44px;height:44px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
h1{margin:6px 0 0;font-size:20px;letter-spacing:-.02em}p{margin:0;color:var(--ink2)}
input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:9px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{color:var(--acc);font-weight:600;min-height:1.3em}#cargando{color:var(--ink2)}
</style></head><body>
<p id="cargando">Cargando…</p>
<form id="f" hidden><div class="logo">M</div><h1>Espía Instagram</h1>
<p>Escribe la contraseña del panel. Solo te la pediremos esta vez en este móvil.</p>
<input id="c" type="password" autocomplete="current-password" placeholder="Contraseña" required>
<p class="err" id="e"></p><button type="submit">Entrar</button></form>
<script>
const ARCHIVO="ABRIR AQU\u00cd.html.enc";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function descifrar(enc,clave){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct)));
}
function mostrar(html){document.open();document.write(html);document.close();}
(async()=>{
  let enc;try{enc=await (await fetch(ARCHIVO+'?t='+Date.now(),{cache:'no-store'})).json();}
  catch(x){document.getElementById('cargando').textContent='No hay conexión. Prueba de nuevo en un momento.';return;}
  let c=null;try{c=localStorage.getItem('espia_clave');}catch(x){}
  if(c){try{return mostrar(await descifrar(enc,c));}catch(x){}}
  document.getElementById('cargando').hidden=true;const f=document.getElementById('f');f.hidden=false;document.getElementById('c').focus();
  f.onsubmit=async ev=>{ev.preventDefault();const v=document.getElementById('c').value.trim();
    try{const html=await descifrar(enc,v);try{localStorage.setItem('espia_clave',v);}catch(x){}mostrar(html);}
    catch(x){document.getElementById('e').textContent='Contraseña incorrecta. Revísala y prueba otra vez.';}};
})();
</script></body></html>
